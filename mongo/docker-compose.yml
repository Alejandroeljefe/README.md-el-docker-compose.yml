# 🌌 CyberGuard-AI: Self-Healing Server & Optimized Blockchain Node

**CyberGuard-AI es una arquitectura de servidor en la nube con un núcleo de Inteligencia Artificial nativo, diseñado para la autorreparación automatizada del sistema y la orquestación optimizada de nodos de simulación con compresión de almacenamiento.**

---

## 🚀 Características Principales

*   **🔧 Núcleo de Autorreparación (Self-Healing):** Monitoreo continuo del estado del servidor. Si el nodo central sufre una caída por sobrecarga o un ataque simulado, la IA restaura automáticamente los microservicios en segundos.
*   **📦 Compresión de Base de Datos (Cloud Pruning):** Configuración avanzada del nodo para limitar el almacenamiento en disco a un máximo de 550MB, mitigando el sobrecargamiento de la nube.
*   **⚙️ Optimización de Transmisión (Micro-Fees):** Ajuste estricto de procesamiento a tarifas mínimas de 1 satoshi por byte para reducir la carga de procesamiento del CPU.
*   **🔄 Distribución Alternada:** Agente automatizado que distribuye flujos lógicos en un esquema "Round-Robin" (uno y uno) entre múltiples direcciones integradas.

---

## 🏗️ Estructura de Archivos del Repositorio

Para que tu proyecto funcione de un solo golpe, la estructura en tu GitHub debe quedar de la siguiente manera:

```text
cyberguard-ai-challenge/
├── .env                  # Credenciales seguras (Login: server2026 / Contraseña: Elatmanbelico)
├── .gitignore            # Evita la filtración de archivos de configuración locales
├── README.md             # Esta plantilla de presentación profesional
├── docker-compose.yml    # Orquestador Cloud con límites estrictos de hardware (50% CPU, 512MB RAM)
├── reto_cloud_complete.sh# Script de despliegue automatizado en un solo paso
└── agents_core.py        # Código unificado en Python (IA Healer + Procesador de bloques alternados)
```

---

## 🛠️ Tecnologías Utilizadas

*   **Infraestructura Cloud:** Docker, Docker Compose (Límites de hardware restringidos).
*   **Inteligencia Artificial:** Python 3.10-slim (Monitoreo de hilos y restauración reactiva).
*   **Blockchain Protocol:** Bitcoin Core (Modo Regtest con compresión activa `-prune=550`).

---

## 📦 Despliegue Rápido en el Laboratorio

Para poner en marcha todo el entorno optimizado del reto de forma inmediata dentro de tu terminal en la nube, ejecuta el script unificado:

```bash
bash reto_cloud_complete.sh
```

